[project]
name = "holodeck"
version = "0.1.0"
description = "Holodeck demos backend: Temporal workers + small API server"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.18",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pillow>=11",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
openai = ["openai>=3.19"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
